<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MovieHub — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="marquee">
  <div class="marquee-inner">
    <a href="index.html" class="brand">Movie<span class="accent">Hub</span></a>
    <nav class="tabs">
      <a href="index.html">Dashboard</a>
      <a href="watchlist.html">Watchlist</a>
      <a href="movie-form.html">Add Movie</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-heading">
    <div>
      <h2>Dashboard</h2>
      <p class="sub">A quick look at your watchlist.</p>
    </div>
    <a href="movie-form.html" class="btn btn-gold">+ Add Movie</a>
  </div>

  <div class="stat-grid" id="statGrid">
    <div class="stat-card">
      <span class="num" id="statTotal">0</span>
      <span class="label">Total movies</span>
    </div>
    <div class="stat-card">
      <span class="num" id="statToWatch">0</span>
      <span class="label">To watch</span>
    </div>
    <div class="stat-card watching">
      <span class="num" id="statWatching">0</span>
      <span class="label">Watching</span>
    </div>
    <div class="stat-card watched">
      <span class="num" id="statWatched">0</span>
      <span class="label">Watched</span>
    </div>
  </div>

  <div class="page-heading">
    <div>
      <h2 style="font-size: 1.1rem;">Recently added</h2>
    </div>
    <a href="watchlist.html" class="btn btn-small">View all</a>
  </div>

  <div id="recentList"></div>
</main>

<script src="app.js"></script>
<script>
  async function render() {
    const movies = await getMovies();

    document.getElementById("statTotal").textContent = movies.length;
    document.getElementById("statToWatch").textContent = movies.filter(
      (m) => m.status === "to-watch"
    ).length;
    document.getElementById("statWatching").textContent = movies.filter(
      (m) => m.status === "watching"
    ).length;
    document.getElementById("statWatched").textContent = movies.filter(
      (m) => m.status === "watched"
    ).length;

    const recentList = document.getElementById("recentList");
    const recent = [...movies]
      .sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded))
      .slice(0, 3);

    if (recent.length === 0) {
      recentList.innerHTML = `
        <div class="empty-state">
          <p>Your watchlist is empty.</p>
          <p>Add the first movie you're planning to watch.</p>
          <a href="movie-form.html" class="btn btn-gold">+ Add Movie</a>
        </div>`;
      return;
    }

    recentList.innerHTML = recent
      .map(
        (m) => `
      <div class="movie-row">
        ${posterTile(m)}
        <div class="movie-info">
          <div class="title">${escapeHtml(m.title)}</div>
          <div class="meta">${escapeHtml(m.genre || "—")} · ${m.year || "—"}</div>
        </div>
        <span class="rating-stars">${starString(m.rating)}</span>
        <span class="badge ${m.status}">${statusLabel(m.status)}</span>
        <div class="row-actions">
          <a class="btn btn-small" href="movie-form.html?id=${m.id}">Edit</a>
        </div>
      </div>`
      )
      .join("");
  }

  document.addEventListener("DOMContentLoaded", render);
</script>

</body>
</html>
